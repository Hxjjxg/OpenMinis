name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install iOS build dependencies
        run: |
          brew update
          brew install ninja llvm libarchive pkg-config
          python3 -m pip install --upgrade pip
          python3 -m pip install meson

      - name: Prepare iOS customization config
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build iOS native dependencies
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh

      - name: Build Minis iOS app (unsigned)
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload build logs and products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-build-output
          path: |
            build/DerivedData/Logs
            build/DerivedData/Build/Products
